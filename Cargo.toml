[package]
name = "aula-assistant"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/chfuchte/aula-assistant"
description = "a user-friendly media control system used in the Gymnasium Riedberg auditorium"
authors = ["Christian Fuchte <christian.fuchte@grb-online.net>"]

[[bin]]
name = "aula-assistant"
path = "src/main.rs"

[dependencies]
thiserror = "2.0"
anyhow = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", "features" = ["cargo"] }
rust-embed = "8.12"
mime_guess = "2.0"
axum = "0.8"
tower = "0.5"
tokio = { version = "1.53", features = ["full"] }
rosc = "0.11"
